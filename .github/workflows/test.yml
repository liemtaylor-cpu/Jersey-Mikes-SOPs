name: Lua checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Syntax-check every Lua file
        run: |
          for f in *.lua; do
            luac5.1 -p "$f" || exit 1
          done

      - name: Run grader tests
        run: lua5.1 test_grade.lua
